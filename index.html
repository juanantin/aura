<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$AURA — Buy $AURA, get $AU (gold)</title>
<meta name="description" content="$AURA on Base. Buy $AURA and get $AU (gold) rewards. 1B total supply, Base chain.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌟</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="bg-overlay"></div>
<canvas id="stars"></canvas>

<main class="page">

  <section class="hero">
    <div class="hero-video-wrap">
      <video class="hero-video" autoplay muted loop playsinline preload="auto">
        <source src="images/aura_vid.mp4" type="video/mp4">
      </video>
    </div>
    <div class="logo-wrap">
      <img class="logo-img" src="images/aura.png" alt="$AURA">
    </div>
    <p class="tagline">Buy <span class="accent">$AURA</span> get <span class="accent">$AU</span> (gold)</p>
    <p class="subtagline">1B Total Supply&nbsp;&nbsp;•&nbsp;&nbsp;<span class="base-chip"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#0052FF"/><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 8.9-7.6h-8.9v-1.8h8.9A9 9 0 0 0 12 3Z" fill="#fff"/></svg> Base Chain</span></p>

    <div class="links">
      <a class="btn btn-icon-only" href="https://x.com/Aura_onbase" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M18.9 2H22l-7.6 8.7L23.3 22h-7.2l-5.6-6.8L4 22H1l8.1-9.3L.8 2h7.4l5.1 6.2L18.9 2Zm-1.3 18h2L6.5 4h-2.1L17.6 20Z"/></svg>
      </a>
      <a class="btn btn-icon-only" href="#" id="chart-link" target="_blank" rel="noopener noreferrer" aria-label="Chart">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
      </a>
      <button class="btn btn-icon-only" id="copy-ca" type="button" data-ca="0xAURA0000000000000000000000000000000000" aria-label="Copy contract address">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="5" y="3" width="12" height="16" rx="1.5"/><path d="M9 7h4M9 10h4M9 13h2"/></svg>
      </button>
    </div>
  </section>

  <section class="dashboard" aria-label="AURA live stats">
    <div class="stat">
      <div class="stat-label">Total Fees Collected</div>
      <div class="stat-value" data-stat="fees">$2,542,783.64</div>
      <div class="stat-icon" aria-hidden="true">
        <img src="images/goldpieces.png" alt="">
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">Total $AU Distributed</div>
      <div class="stat-value" data-stat="au-amount">12,842.34 AU</div>
      <div class="stat-subvalue" data-stat="au-usd">$2,683,421.59</div>
      <div class="stat-icon" aria-hidden="true">
        <img src="images/ingot.png" alt="">
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">Total Holders</div>
      <div class="stat-value" data-stat="holders">18,742</div>
      <div class="stat-icon" aria-hidden="true">
        <img src="images/holders.png" alt="">
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">Market Cap</div>
      <div class="stat-value" data-stat="mcap">$15,284,712</div>
      <div class="stat-icon" aria-hidden="true">
        <img src="images/mc.png" alt="">
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">Liquidity</div>
      <div class="stat-value" data-stat="liquidity">$3,127,884</div>
      <div class="stat-icon" aria-hidden="true">
        <img src="images/liquid.png" alt="">
      </div>
    </div>

    <div class="stat">
      <div class="stat-label">24H Volume</div>
      <div class="stat-value" data-stat="volume">$1,842,229</div>
      <div class="stat-icon" aria-hidden="true">
        <img src="images/vol.png" alt="">
      </div>
    </div>
  </section>

  <div class="bottom-glow-wrap" aria-hidden="true">
    <video class="bottom-glow" autoplay muted loop playsinline preload="auto">
      <source src="images/aura_fire.mp4" type="video/mp4">
    </video>
  </div>

  <footer class="footer">
    <div class="footer-col">
      <div class="footer-label">Launched in</div>
      <a class="footer-brand" href="https://www.thestonks.exchange" target="_blank" rel="noopener noreferrer">
        <img class="footer-logo" src="images/stonkex_button.png" alt="Stonks.Exchange">
      </a>
    </div>
    <div class="footer-col">
      <div class="footer-label">Holders rewards powered by</div>
      <a class="footer-brand" href="https://www.stockify.finance" target="_blank" rel="noopener noreferrer">
        <img class="footer-logo" src="images/stockify_logo.png" alt="Stockify">
      </a>
    </div>
  </footer>

</main>

<div class="toast" id="toast" role="status" aria-live="polite">Contract address copied</div>

<script src="script.js"></script>
</body>
</html>
